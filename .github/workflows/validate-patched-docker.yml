name: Validate Patched Docker Build

on:
  push:
    branches:
      - patch/patched-docker-release
  pull_request:
    branches:
      - patch/patched-docker-release

permissions:
  contents: read

concurrency:
  group: validate-patched-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: lobehub/lobehub

jobs:
  docker-build:
    name: Build patched Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Resolve build target
        id: target
        run: |
          set -euo pipefail

          # The image is built from the newest upstream release tag, not from
          # canary — so that tag is the tree a patch has to apply to. Validating
          # against canary instead misses a patch that only fits the newer tree
          # and reports green while the build fails.
          tag="$(
            git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPOSITORY}.git" 'refs/tags/v*' |
              awk '{print $2}' |
              sed 's#refs/tags/##' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$' |
              sort -V |
              tail -n 1
          )"
          if [ -z "$tag" ]; then
            echo "No upstream release tag to validate against" >&2
            exit 1
          fi

          echo "Validating against the build target ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream build target
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ steps.target.outputs.tag }}
          path: source

      - name: Apply local patches
        working-directory: source
        run: |
          set -euo pipefail

          mapfile -t patch_paths < ../automation/patches/paths.txt
          for patch_path in "${patch_paths[@]}"; do
            patch="../automation/$patch_path"
            if [ ! -f "$patch" ]; then
              echo "Listed patch is missing: ${patch}" >&2
              exit 1
            fi
            echo "Applying ${patch}"
            git apply --unidiff-zero --check "$patch"
            git apply --unidiff-zero "$patch"
          done

      - name: Build Docker image without pushing
        working-directory: source
        run: |
          set -euo pipefail

          docker build \
            --platform linux/amd64 \
            --build-arg SHA="$(git rev-parse --short HEAD)" \
            --tag lobehub:patch-validation \
            .
