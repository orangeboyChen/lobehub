name: Build Patched Docker Image

on:
  schedule:
    # Every 30 minutes.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'LobeHub version to build, for example 2.2.2 or v2.2.3-canary.18. Empty means only the latest upstream release tag.'
        required: false
        type: string
      force:
        description: 'Rebuild even when the target image tag already exists.'
        default: false
        required: false
        type: boolean
      push_latest:
        description: 'Also update the latest tag. Scheduled builds update latest for the newest stable release in the batch.'
        default: false
        required: false
        type: boolean

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version || 'latest-stable' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: lobehub/lobehub
  REGISTRY_IMAGE: ghcr.io/orangeboychen/lobehub
  AI_PATCH_REPAIR_ENABLED: ${{ vars.ENABLE_AI_PATCH_REPAIR }}

jobs:
  patch-validation:
    name: Validate Patches Against Upstream Canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Checkout upstream canary
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: canary
          path: source

      - name: Validate local patches
        working-directory: source
        run: |
          set -euo pipefail

          mapfile -t patch_paths < ../automation/patches/paths.txt
          for patch_path in "${patch_paths[@]}"; do
            patch="../automation/$patch_path"
            if [ ! -f "$patch" ]; then
              echo "Listed patch is missing: ${patch}" >&2
              exit 1
            fi
            echo "Validating ${patch}"
            git apply --unidiff-zero --check "$patch"
            git apply --unidiff-zero "$patch"
          done

  repair-patches:
    name: Repair Failed Patches
    needs: patch-validation
    if: failure() && needs.patch-validation.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Restore existing repair branch
        working-directory: automation
        run: |
          set -euo pipefail

          branch='codex/repair-patches'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch --track "origin/$branch"
          fi

      - name: Checkout upstream canary
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: canary
          path: source

      - name: Find an existing repair pull request
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repair_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head codex/repair-patches --base "$GITHUB_REF_NAME" --state open --json url --jq '.[0].url')"
          if [ -n "$repair_pr" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "url=$repair_pr" >> "$GITHUB_OUTPUT"
            echo "An open repair pull request already exists: $repair_pr"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether AI repair is enabled
        id: configuration
        run: |
          if [ "$AI_PATCH_REPAIR_ENABLED" = 'true' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'AI patch repair is disabled; set ENABLE_AI_PATCH_REPAIR=true to enable it.'
          fi

      - name: Collect upstream PR statuses
        if: steps.configuration.outputs.enabled == 'true' && steps.existing-pr.outputs.exists != 'true'
        working-directory: automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          status_file='.codex-upstream-pr-status.jsonl'
          : > "$status_file"
          for patch in patches/pr-*/*.patch; do
            [ -f "$patch" ] || continue
            pr_number="${patch#patches/pr-}"
            pr_number="${pr_number%%/*}"
            gh pr view "$pr_number" --repo "$UPSTREAM_REPOSITORY" \
              --json number,state,mergedAt,url --jq '{number, state, mergedAt, url}' \
              >> "$status_file"
          done

      - name: Ask Codex to repair patches
        if: steps.configuration.outputs.enabled == 'true' && steps.existing-pr.outputs.exists != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          model: ${{ secrets.CODEX_MODEL }}
          allow-bot-users: github-actions
          permission-profile: ":workspace"
          prompt: |
            One or more paths listed in automation/patches/paths.txt is missing,
            or a patch in automation/patches no longer applies to the current
            upstream canary checkout in source/. Treat paths.txt as the only
            authoritative patch manifest. Repair the failed patch set so it
            preserves its original intent and applies cleanly in listed order.
            Before changing any patch under patches/pr-*, read
            automation/.codex-upstream-pr-status.jsonl. This file is
            authoritative for the corresponding upstream pull request status.
            Do not invoke gh, request network or sandbox escalation, or request
            GitHub authentication. Determine whether the PR behavior is already
            present in source/.
            If that PR is merged or closed, you must delete its corresponding
            patch file, remove its entry from both automation/README.md and
            automation/README.zh.md, and remove exactly that patch path from
            automation/patches/paths.txt. Do not leave a deleted patch listed
            in paths.txt. Do not make any workflow changes. Otherwise preserve
            every intended
            user-visible and functional behavior, translating it to the current
            upstream canary implementation when necessary. Modify only files
            under patches/, the two README files, and the matching paths.txt
            entry when removing a merged or closed PR patch. Do not change
            source/. Validate every remaining patch with
            `git apply --unidiff-zero --check`, applying each successful patch
            before checking the next one. Do not commit, push, or open a pull
            request; the workflow will do that after validation.

      - name: Validate repaired patches
        if: steps.configuration.outputs.enabled == 'true' && steps.existing-pr.outputs.exists != 'true'
        working-directory: source
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -fdx

          mapfile -t repaired_patch_paths < ../automation/patches/paths.txt
          [ "${#repaired_patch_paths[@]}" -gt 0 ] || {
            echo 'Repaired patch path list is empty' >&2
            exit 1
          }

          for patch_path in "${repaired_patch_paths[@]}"; do
            patch="../automation/$patch_path"
            if [ ! -f "$patch" ]; then
              echo "Listed patch is missing: ${patch}" >&2
              exit 1
            fi
            git apply --unidiff-zero --check "$patch"
            git apply --unidiff-zero "$patch"
          done

      - name: Create repair pull request
        if: steps.configuration.outputs.enabled == 'true' && steps.existing-pr.outputs.exists != 'true'
        working-directory: automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch='codex/repair-patches'
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$GITHUB_REF_NAME" --state open --json url --jq '.[0].url')"

          repair_files=(patches README.md README.zh.md)
          if git diff --quiet -- "${repair_files[@]}" && \
            git diff --quiet "origin/$GITHUB_REF_NAME...HEAD" -- "${repair_files[@]}"; then
            if [ -n "$existing_pr" ]; then
              echo "Existing repair pull request is already valid: $existing_pr"
              exit 0
            fi

            echo "Codex did not produce a patch change" >&2
            exit 1
          fi

          git config user.name "codex"
          git config user.email "codex@users.noreply.github.com"
          if ! git branch --show-current | grep -Fxq "$branch"; then
            git switch -c "$branch"
          fi
          git add "${repair_files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "fix(patches): repair upstream canary conflicts"
          fi
          git push origin "$branch"

          if [ -z "$existing_pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$GITHUB_REF_NAME" \
              --head "$branch" \
              --reviewer orangeboyChen \
              --title "fix(patches): repair upstream canary conflicts" \
              --body "Codex repaired patches that no longer applied to upstream canary. The workflow revalidated the complete patch set before creating this PR."
          else
            echo "Updated existing repair pull request: $existing_pr"
          fi

  prepare:
    name: Resolve Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build matrix
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUSH_LATEST: ${{ github.event.inputs.push_latest }}
        run: |
          set -euo pipefail

          normalize_tag() {
            local value="$1"
            value="${value#refs/tags/}"
            value="${value#v}"
            printf 'v%s' "$value"
          }

          resolve_commit() {
            local tag="$1"
            local commit

            commit="$(
              git ls-remote --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${tag}^{}" |
                awk '{print $1}' |
                head -n 1
            )"

            if [ -z "$commit" ]; then
              commit="$(
                git ls-remote --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${tag}" |
                  awk '{print $1}' |
                  head -n 1
              )"
            fi

            if [ -z "$commit" ]; then
              echo "Unable to resolve commit for ${tag}" >&2
              exit 1
            fi

            printf '%s' "$commit"
          }

          mapfile -t upstream_tags < <(
            git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPOSITORY}.git" 'refs/tags/v*' |
              awk '{print $2}' |
              sed 's#refs/tags/##' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$' |
              sort -V
          )

          latest_upstream_tag="${upstream_tags[-1]}"

          build_tags=()

          if [ -n "${INPUT_VERSION:-}" ]; then
            base_tag="$(normalize_tag "${INPUT_VERSION}")"
            if ! git ls-remote --exit-code --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${base_tag}" >/dev/null; then
              echo "Upstream tag ${base_tag} does not exist" >&2
              exit 1
            fi
            build_tags=("${base_tag}")
          else
            # Patches are only validated against the current upstream canary tree,
            # so automatic builds must target the latest upstream tag only.
            build_tags=("${latest_upstream_tag}")
          fi

          matrix_tags=()
          for tag in "${build_tags[@]}"; do
            version="${tag#v}"

            if [ "${FORCE:-false}" != "true" ] && docker buildx imagetools inspect "${REGISTRY_IMAGE}:${version}" >/dev/null 2>&1; then
              echo "Skipping existing image ${REGISTRY_IMAGE}:${version}"
              continue
            fi

            matrix_tags+=("$tag")
          done

          if [ "${#matrix_tags[@]}" -eq 0 ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo "No upstream versions require a build"
            exit 0
          fi

          publish_latest_tag=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${INPUT_PUSH_LATEST:-false}" = "true" ]; then
            for tag in "${matrix_tags[@]}"; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                publish_latest_tag="$tag"
              fi
            done

            if [ -z "$publish_latest_tag" ] && [ "${INPUT_PUSH_LATEST:-false}" = "true" ]; then
              publish_latest_tag="${matrix_tags[-1]}"
            fi
          fi

          matrix='[]'
          for tag in "${matrix_tags[@]}"; do
            version="${tag#v}"
            commit="$(resolve_commit "$tag")"
            push_latest=false

            if [ -n "$publish_latest_tag" ] && [ "$tag" = "$publish_latest_tag" ]; then
              push_latest=true
            fi

            matrix="$(
              jq -c \
                --arg tag "$tag" \
                --arg version "$version" \
                --arg commit "$commit" \
                --argjson push_latest "$push_latest" \
                '. + [{tag: $tag, version: $version, commit: $commit, push_latest: $push_latest}]' \
                <<<"$matrix"
            )"
          done

          if [ "$(jq 'length' <<<"$matrix")" -eq 0 ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo "No upstream versions require a build"
            exit 0
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.release.version }} (${{ matrix.platform }})
    needs:
      - prepare
      - patch-validation
    if: needs.prepare.outputs.should_build == 'true' && needs.patch-validation.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.prepare.outputs.matrix) }}
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Checkout upstream release
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ matrix.release.commit }}
          path: source

      - name: Apply local patches
        working-directory: source
        run: |
          set -euo pipefail

          mapfile -t patch_paths < ../automation/patches/paths.txt
          for patch_path in "${patch_paths[@]}"; do
            patch="../automation/$patch_path"
            if [ ! -f "$patch" ]; then
              echo "Listed patch is missing: ${patch}" >&2
              exit 1
            fi
            echo "Applying ${patch}"
            git apply --unidiff-zero --check "$patch"
            git apply --unidiff-zero "$patch"
          done

      - name: Resolve commit SHA
        id: vars
        working-directory: source
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: source
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
          VERSION: ${{ matrix.release.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          case "$PLATFORM" in
            linux/amd64) arch_tag="${REGISTRY_IMAGE}:${VERSION}-amd64" ;;
            linux/arm64) arch_tag="${REGISTRY_IMAGE}:${VERSION}-arm64" ;;
            *) echo "Unsupported platform: ${PLATFORM}" >&2; exit 1 ;;
          esac

          docker buildx build \
            --platform "$PLATFORM" \
            --build-arg SHA="${SHA_SHORT}" \
            -t "$arch_tag" \
            --push \
            .

      - name: Inspect image
        env:
          VERSION: ${{ matrix.release.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux/amd64) arch_tag="${REGISTRY_IMAGE}:${VERSION}-amd64" ;;
            linux/arm64) arch_tag="${REGISTRY_IMAGE}:${VERSION}-arm64" ;;
            *) echo "Unsupported platform: ${PLATFORM}" >&2; exit 1 ;;
          esac

          docker buildx imagetools inspect "$arch_tag"

  publish:
    name: Publish ${{ matrix.release.version }}
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest
        env:
          VERSION: ${{ matrix.release.version }}
          PUSH_LATEST: ${{ matrix.release.push_latest || false }}
        run: |
          set -euo pipefail

          tags=(-t "${REGISTRY_IMAGE}:${VERSION}")
          if [ "$PUSH_LATEST" = "true" ]; then
            tags+=(-t "${REGISTRY_IMAGE}:latest")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "${REGISTRY_IMAGE}:${VERSION}-amd64" \
            "${REGISTRY_IMAGE}:${VERSION}-arm64"

      - name: Inspect image
        env:
          VERSION: ${{ matrix.release.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ matrix.release.tag }}
          name: ${{ matrix.release.tag }}
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          makeLatest: ${{ matrix.release.push_latest }}
