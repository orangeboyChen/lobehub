name: Build Patched Docker Image

on:
  schedule:
    # Every 30 minutes.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'LobeHub version to build, for example 2.2.2 or v2.2.3-canary.18. Empty means the latest upstream release tag and newer missed versions.'
        required: false
        type: string
      force:
        description: 'Rebuild even when the target image tag already exists.'
        default: false
        required: false
        type: boolean
      push_latest:
        description: 'Also update the latest tag. Scheduled builds update latest for the newest stable release in the batch.'
        default: false
        required: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version || 'latest-stable' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: lobehub/lobehub
  REGISTRY_IMAGE: ghcr.io/orangeboychen/lobehub

jobs:
  prepare:
    name: Resolve Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build matrix
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUSH_LATEST: ${{ github.event.inputs.push_latest }}
        run: |
          set -euo pipefail

          normalize_tag() {
            local value="$1"
            value="${value#refs/tags/}"
            value="${value#v}"
            printf 'v%s' "$value"
          }

          is_newer() {
            local base="$1"
            local candidate="$2"
            if [ "$base" = "$candidate" ]; then
              return 1
            fi

            [ "$(printf '%s\n%s\n' "$base" "$candidate" | sort -V | tail -n 1)" = "$candidate" ]
          }

          resolve_commit() {
            local tag="$1"
            local commit

            commit="$(
              git ls-remote --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${tag}^{}" |
                awk '{print $1}' |
                head -n 1
            )"

            if [ -z "$commit" ]; then
              commit="$(
                git ls-remote --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${tag}" |
                  awk '{print $1}' |
                  head -n 1
              )"
            fi

            if [ -z "$commit" ]; then
              echo "Unable to resolve commit for ${tag}" >&2
              exit 1
            fi

            printf '%s' "$commit"
          }

          mapfile -t upstream_tags < <(
            git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPOSITORY}.git" 'refs/tags/v*' |
              awk '{print $2}' |
              sed 's#refs/tags/##' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$' |
              sort -V
          )

          latest_upstream_tag="${upstream_tags[-1]}"
          latest_repo_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$' |
              sort -V |
              tail -n 1 || true
          )"

          build_tags=()
          base_tag=""

          if [ -n "${INPUT_VERSION:-}" ]; then
            base_tag="$(normalize_tag "${INPUT_VERSION}")"
            if ! git ls-remote --exit-code --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${base_tag}" >/dev/null; then
              echo "Upstream tag ${base_tag} does not exist" >&2
              exit 1
            fi
            build_tags=("${base_tag}")
          else
            base_tag="${latest_repo_tag:-}"
            if [ -z "$base_tag" ]; then
              build_tags=("${latest_upstream_tag}")
            else
              for tag in "${upstream_tags[@]}"; do
                if is_newer "$base_tag" "$tag"; then
                  build_tags+=("$tag")
                fi
              done
            fi
          fi

          matrix_tags=()
          for tag in "${build_tags[@]}"; do
            version="${tag#v}"

            if [ "${FORCE:-false}" != "true" ] && docker buildx imagetools inspect "${REGISTRY_IMAGE}:${version}" >/dev/null 2>&1; then
              echo "Skipping existing image ${REGISTRY_IMAGE}:${version}"
              continue
            fi

            matrix_tags+=("$tag")
          done

          if [ "${#matrix_tags[@]}" -eq 0 ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo "No upstream versions require a build"
            exit 0
          fi

          publish_latest_tag=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${INPUT_PUSH_LATEST:-false}" = "true" ]; then
            for tag in "${matrix_tags[@]}"; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                publish_latest_tag="$tag"
              fi
            done

            if [ -z "$publish_latest_tag" ] && [ "${INPUT_PUSH_LATEST:-false}" = "true" ]; then
              publish_latest_tag="${matrix_tags[-1]}"
            fi
          fi

          matrix='[]'
          for tag in "${matrix_tags[@]}"; do
            version="${tag#v}"
            commit="$(resolve_commit "$tag")"
            push_latest=false

            if [ -n "$publish_latest_tag" ] && [ "$tag" = "$publish_latest_tag" ]; then
              push_latest=true
            fi

            matrix="$(
              jq -c \
                --arg tag "$tag" \
                --arg version "$version" \
                --arg commit "$commit" \
                --argjson push_latest "$push_latest" \
                '. + [{tag: $tag, version: $version, commit: $commit, push_latest: $push_latest}]' \
                <<<"$matrix"
            )"
          done

          if [ "$(jq 'length' <<<"$matrix")" -eq 0 ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo "No upstream versions require a build"
            exit 0
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.release.version }} (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.prepare.outputs.matrix) }}
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Checkout upstream release
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ matrix.release.commit }}
          path: source

      - name: Apply local patches
        working-directory: source
        run: |
          set -euo pipefail
          git apply --unidiff-zero --check ../automation/patches/bug/ios-viewport.patch
          git apply --unidiff-zero ../automation/patches/bug/ios-viewport.patch
          git apply --unidiff-zero --check ../automation/patches/bug/sidebar-orphan-agents.patch
          git apply --unidiff-zero ../automation/patches/bug/sidebar-orphan-agents.patch
          git apply --unidiff-zero --check ../automation/patches/pr-16325/pr-16325.patch
          git apply --unidiff-zero ../automation/patches/pr-16325/pr-16325.patch
          git apply --unidiff-zero --check ../automation/patches/pr-16545/pr-16545.patch
          git apply --unidiff-zero ../automation/patches/pr-16545/pr-16545.patch
          git apply --unidiff-zero --check ../automation/patches/bug/lobehub-skill.patch
          git apply --unidiff-zero ../automation/patches/bug/lobehub-skill.patch
          git apply --unidiff-zero --check ../automation/patches/bug/docker-canvas-native-packages.patch
          git apply --unidiff-zero ../automation/patches/bug/docker-canvas-native-packages.patch
          git apply --unidiff-zero --check ../automation/patches/pr-16627/pr-16627.patch
          git apply --unidiff-zero ../automation/patches/pr-16627/pr-16627.patch
          git apply --unidiff-zero --check ../automation/patches/pr-16609/pr-16609.patch
          git apply --unidiff-zero ../automation/patches/pr-16609/pr-16609.patch
          git apply --unidiff-zero --check ../automation/patches/pr-16616/pr-16616.patch
          git apply --unidiff-zero ../automation/patches/pr-16616/pr-16616.patch

      - name: Resolve commit SHA
        id: vars
        working-directory: source
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: source
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
          VERSION: ${{ matrix.release.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          case "$PLATFORM" in
            linux/amd64) arch_tag="${REGISTRY_IMAGE}:${VERSION}-amd64" ;;
            linux/arm64) arch_tag="${REGISTRY_IMAGE}:${VERSION}-arm64" ;;
            *) echo "Unsupported platform: ${PLATFORM}" >&2; exit 1 ;;
          esac

          docker buildx build \
            --platform "$PLATFORM" \
            --build-arg SHA="${SHA_SHORT}" \
            -t "$arch_tag" \
            --push \
            .

      - name: Inspect image
        env:
          VERSION: ${{ matrix.release.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux/amd64) arch_tag="${REGISTRY_IMAGE}:${VERSION}-amd64" ;;
            linux/arm64) arch_tag="${REGISTRY_IMAGE}:${VERSION}-arm64" ;;
            *) echo "Unsupported platform: ${PLATFORM}" >&2; exit 1 ;;
          esac

          docker buildx imagetools inspect "$arch_tag"

  publish:
    name: Publish ${{ matrix.release.version }}
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest
        env:
          VERSION: ${{ matrix.release.version }}
          PUSH_LATEST: ${{ matrix.release.push_latest || false }}
        run: |
          set -euo pipefail

          tags=(-t "${REGISTRY_IMAGE}:${VERSION}")
          if [ "$PUSH_LATEST" = "true" ]; then
            tags+=(-t "${REGISTRY_IMAGE}:latest")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "${REGISTRY_IMAGE}:${VERSION}-amd64" \
            "${REGISTRY_IMAGE}:${VERSION}-arm64"

      - name: Inspect image
        env:
          VERSION: ${{ matrix.release.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ matrix.release.tag }}
          name: ${{ matrix.release.tag }}
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          makeLatest: ${{ matrix.release.push_latest }}
