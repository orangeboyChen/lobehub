name: Patch Repair PR Lifecycle

on:
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: lobehub/lobehub
  REPAIR_BRANCH: codex/repair-patches
  PATCH_BRANCH: patch/patched-docker-release
  AI_PATCH_REPAIR_ENABLED: ${{ vars.ENABLE_AI_PATCH_REPAIR }}

jobs:
  lifecycle:
    name: Handle repair PR lifecycle
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/repair-patches' &&
      github.event.pull_request.base.ref == 'patch/patched-docker-release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Trigger patched Docker build after merge
        if: github.event.pull_request.merged == true
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-patched-docker.yml',
              ref: 'patch/patched-docker-release',
              inputs: { force: 'true' },
            });

      - name: Delete repair branch after close
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/codex/repair-patches',
              });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }

  recreate:
    name: Recreate repair PR
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'recreate' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Validate PR and mark comment in progress
        id: context
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            if (pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pull.head.ref !== process.env.REPAIR_BRANCH ||
                pull.base.ref !== process.env.PATCH_BRANCH ||
                pull.state !== 'open') {
              core.setFailed('This comment is not on the patch repair PR');
              return;
            }
            const { data: reaction } = await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });
            core.setOutput('reaction_id', String(reaction.id));
            core.setOutput('pr_number', String(pull.number));

      - name: Checkout patch branch
        if: steps.context.outputs.reaction_id != ''
        uses: actions/checkout@v6
        with:
          ref: patch/patched-docker-release
          path: automation
          fetch-depth: 0

      - name: Checkout upstream canary
        if: steps.context.outputs.reaction_id != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: canary
          path: source

      - name: Recreate repair branch from patch branch
        id: repair-branch
        if: steps.context.outputs.reaction_id != ''
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin "$REPAIR_BRANCH" | awk '{print $1}')"
          [ -n "$remote_sha" ] || {
            echo "Remote repair branch does not exist: $REPAIR_BRANCH" >&2
            exit 1
          }
          echo "remote_sha=$remote_sha" >> "$GITHUB_OUTPUT"
          git switch -C "$REPAIR_BRANCH"

      - name: Find an existing repair pull request
        id: existing-pr
        if: steps.context.outputs.reaction_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repair_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REPAIR_BRANCH" --base "$PATCH_BRANCH" --state open --json number,url --jq '.[0] | "\(.number)\t\(.url)"')"
          test -n "$repair_pr"
          test "${repair_pr%%$'\t'*}" = "${{ steps.context.outputs.pr_number }}"
          echo "url=${repair_pr#*$'\t'}" >> "$GITHUB_OUTPUT"

      - name: Check whether AI repair is enabled
        id: configuration
        if: steps.context.outputs.reaction_id != ''
        run: |
          if [ "$AI_PATCH_REPAIR_ENABLED" = 'true' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'AI patch repair is disabled; set ENABLE_AI_PATCH_REPAIR=true to enable it.' >&2
            exit 1
          fi

      - name: Collect repair PR context
        if: steps.context.outputs.reaction_id != '' && steps.configuration.outputs.enabled == 'true'
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr view "${{ steps.context.outputs.pr_number }}" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,state,baseRefName,headRefName,author,url \
            > .codex-repair-pr-context.json

      - name: Collect failed build logs
        if: steps.context.outputs.reaction_id != '' && steps.configuration.outputs.enabled == 'true'
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          failed_run="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-patched-docker.yml --status failure --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$failed_run" ]; then
            gh run view "$failed_run" --repo "$GITHUB_REPOSITORY" --log-failed \
              > .codex-build-failure.log || true
          fi

      - name: Collect upstream PR statuses
        if: steps.context.outputs.reaction_id != '' && steps.configuration.outputs.enabled == 'true'
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPOSITORY: ${{ env.UPSTREAM_REPOSITORY }}
        run: |
          ./.github/scripts/collect-upstream-pr-statuses.sh

      - name: Run Codex repair
        if: steps.context.outputs.reaction_id != '' && steps.configuration.outputs.enabled == 'true'
        uses: ./automation/.github/actions/codex-patch-repair
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          model: ${{ secrets.CODEX_MODEL }}
          repair-target-mode: canary-patch-validation
          repair-target-ref: canary

      - name: Validate repaired patches
        if: steps.context.outputs.reaction_id != '' && steps.configuration.outputs.enabled == 'true'
        working-directory: source
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -fdx

          mapfile -t repaired_patch_paths < ../automation/patches/paths.txt
          [ "${#repaired_patch_paths[@]}" -gt 0 ] || {
            echo 'Repaired patch path list is empty' >&2
            exit 1
          }

          for patch_path in "${repaired_patch_paths[@]}"; do
            patch="../automation/$patch_path"
            if [ ! -f "$patch" ]; then
              echo "Listed patch is missing: ${patch}" >&2
              exit 1
            fi
            git apply --unidiff-zero --check "$patch"
            git apply --unidiff-zero "$patch"
          done

      - name: Commit and force-push repair branch
        if: steps.context.outputs.reaction_id != '' && steps.configuration.outputs.enabled == 'true'
        working-directory: automation
        run: |
          set -euo pipefail
          repair_files=(patches README.md README.zh.md)
          if git diff --quiet -- "${repair_files[@]}"; then
            echo 'Codex did not produce a patch change' >&2
            exit 1
          fi

          git config user.name codex
          git config user.email codex@users.noreply.github.com
          git add "${repair_files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'fix(patches): recreate upstream canary repair'
          fi
          git push \
            --force-with-lease="refs/heads/$REPAIR_BRANCH:${{ steps.repair-branch.outputs.remote_sha }}" \
            origin "HEAD:refs/heads/$REPAIR_BRANCH"

      - name: Update recreated pull request
        if: success() && steps.context.outputs.reaction_id != '' && steps.configuration.outputs.enabled == 'true'
        working-directory: automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          summary_file='.codex-repair-pr.md'
          default_title='fix(patches): recreate upstream canary repair'
          if [ -f "$summary_file" ]; then
            pr_title="$(sed -n 's/^Title: //p' "$summary_file" | head -n 1)"
            [ -n "$pr_title" ] || pr_title="$default_title"
            printf '\n## Workflow validation\n\n- All listed patches applied successfully against repair target canary.\n' >> "$summary_file"
            pr_body_args=(--body-file "$summary_file")
          else
            pr_title="$default_title"
            pr_body_args=(--body 'Codex recreated the patch repair pull request and validated the complete patch set against upstream canary.')
          fi
          gh pr edit "${{ steps.context.outputs.pr_number }}" \
            --repo "$GITHUB_REPOSITORY" --title "$pr_title" "${pr_body_args[@]}"

      - name: Mark recreate comment complete or failed
        if: always() && steps.context.outputs.reaction_id != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentId = context.payload.comment.id;
            const reactionId = Number('${{ steps.context.outputs.reaction_id }}');
            try {
              await github.rest.reactions.deleteForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                reaction_id: reactionId,
              });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }
            if ('${{ job.status }}' === 'success') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                content: '+1',
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: '❌ Recreate failed.',
              });
            }
